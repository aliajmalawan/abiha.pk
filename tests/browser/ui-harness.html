<!doctype html><meta charset="utf-8"><title>running</title>
<body style="margin:0"><script>
const R = [];
const ok = (name, pass, extra = '') => R.push([pass ? 'PASS' : 'FAIL', name, extra]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function load(url, w = 1280, h = 900) {
  return new Promise((resolve) => {
    document.querySelectorAll('iframe').forEach((f) => f.remove());
    const f = document.createElement('iframe');
    f.style.cssText = `border:0;width:${w}px;height:${h}px`;
    f.onload = async () => { await sleep(700); resolve(f); };
    f.src = url;
    document.body.appendChild(f);
  });
}
const key = (win, k, extra = {}) => {
  const el = win.document.activeElement || win.document.body;
  el.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }));
  win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true }));
};
const inside = (root, el) => root.contains(el);
const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden' && getComputedStyle(el).display !== 'none';
const until = async (cond, ms = 2500) => { const t = Date.now(); while (Date.now() - t < ms) { if (cond()) return true; await sleep(60); } return cond(); };

(async () => {
  const params = new URLSearchParams(location.search);
  const reduced = params.get('reduced') === '1';
  ok('prefers-reduced-motion matches the browser flag', matchMedia('(prefers-reduced-motion: reduce)').matches === reduced);

  /* ---------- home: reveal ---------- */
  let f = await load('/');
  let w = f.contentWindow, d = w.document;
  const reveals = [...d.querySelectorAll('[data-reveal]')];
  ok('home has scroll-reveal elements', reveals.length > 3, `count=${reveals.length}`);
  ok('html has .js class', d.documentElement.classList.contains('js'));
  const below = reveals.filter((e) => e.getBoundingClientRect().top > 1100);
  if (reduced) {
    ok('reduced motion: nothing is hidden or moved', reveals.every((e) => w.getComputedStyle(e).opacity === '1' && w.getComputedStyle(e).transform === 'none'));
  } else {
    ok('below-the-fold items start hidden', below.length > 0 && below.every((e) => w.getComputedStyle(e).opacity === '0'), `below=${below.length}`);
    below[0]?.scrollIntoView(); await until(() => below[0].classList.contains('is-visible') && w.getComputedStyle(below[0]).opacity === '1', 3000);
    ok('item fades in once scrolled to', below[0] && below[0].classList.contains('is-visible') && w.getComputedStyle(below[0]).opacity === '1', `class=${below[0]?.className} opacity=${w.getComputedStyle(below[0]).opacity}`);
  }
  w.scrollTo(0, 0);

  /* ---------- Content-Security-Policy really blocks injected code ---------- */
  let violations = 0;
  d.addEventListener('securitypolicyviolation', () => violations++);
  const injected = d.createElement('script'); injected.textContent = 'window.__pwnInline = 1'; d.body.appendChild(injected);
  const evil = d.createElement('button'); evil.setAttribute('onclick', 'window.__pwnHandler = 1'); d.body.appendChild(evil); evil.click();
  const ext = d.createElement('script'); ext.src = 'https://evil.example/x.js'; d.body.appendChild(ext);
  await sleep(500);
  ok('CSP blocks an injected inline <script>', w.__pwnInline === undefined);
  ok('CSP blocks an injected inline event handler', w.__pwnHandler === undefined);
  ok('CSP reported the violations to the page', violations >= 2, `violations=${violations}`);
  ok('page carries a nonce on its own inline script', !!d.querySelector('script[nonce]') && d.querySelector('script[nonce]').nonce !== '');

  /* ---------- toast ---------- */
  w.Alpine.store('ui').notify('Saved to your wishlist.'); await sleep(450);
  const toast = d.querySelector('.toast');
  ok('toast shows inside a polite live region', visible(toast) && toast.parentElement.getAttribute('aria-live') === 'polite');
  toast?.querySelector('button')?.click(); await until(() => !visible(d.querySelector('.toast')), 2500);
  ok('toast can be dismissed', !visible(d.querySelector('.toast')), String(d.querySelector('.toast')?.style.cssText));

  /* ---------- cart drawer: open, focus, trap, escape, restore ---------- */
  const bag = d.querySelector('a[aria-label="Shopping bag"]');
  bag.focus(); bag.click(); await sleep(900);
  const drawer = d.querySelector('[aria-labelledby="drawer-title"]');
  const panel = drawer.querySelector('aside');
  ok('bag link opens the drawer (no navigation)', w.location.pathname === '/' && w.Alpine.store('drawer').open === true);
  ok('drawer is visible', visible(drawer));
  ok('drawer is a modal dialog with a label', drawer.getAttribute('role') === 'dialog' && drawer.getAttribute('aria-modal') === 'true' && !!d.getElementById('drawer-title'));
  ok('page behind is scroll-locked', d.documentElement.classList.contains('scroll-locked'));
  ok('focus moved into the drawer', inside(panel, d.activeElement), d.activeElement?.outerHTML?.slice(0, 60));
  let stray = 0;
  for (let i = 0; i < 8; i++) { key(w, 'Tab'); if (!inside(panel, d.activeElement)) stray++; }
  // synthetic Tab events do not move focus by themselves; the trap only intervenes at the edges, so check Shift+Tab from the first control too
  const items = [...panel.querySelectorAll('a[href],button:not([disabled])')].filter((n) => n.offsetParent !== null);
  items[items.length - 1].focus(); key(w, 'Tab');
  ok('Tab from the last control wraps to the first', d.activeElement === items[0], d.activeElement?.outerHTML?.slice(0, 60));
  items[0].focus(); key(w, 'Tab', { shiftKey: true });
  ok('Shift+Tab from the first control wraps to the last', d.activeElement === items[items.length - 1]);
  key(w, 'Escape'); await sleep(700);
  await until(() => !visible(drawer), 2000);
  ok('Escape closes the drawer', w.Alpine.store('drawer').open === false && !visible(drawer));
  ok('scroll lock released', !d.documentElement.classList.contains('scroll-locked'));
  ok('focus returns to the bag link', d.activeElement === bag);

  /* ---------- add to bag → drawer shows the item; change quantity; remove → empty state ---------- */
  const token = d.querySelector('meta[name="csrf-token"]').content;
  const add = await w.fetch('/cart/items', { method: 'POST', headers: { 'X-CSRF-TOKEN': token, Accept: 'application/json', 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ product_id: 1, quantity: 1 }) });
  const addData = await add.json(); w.Alpine.store('cart').count = addData.count;
  await w.Alpine.store('drawer').show(); await sleep(900);
  ok('drawer lists the product with quantity controls', /Sample Product 001/.test(panel.textContent) && !!panel.querySelector('[aria-label="Increase quantity"]'), panel.textContent.replace(/\s+/g, ' ').slice(0, 90));
  ok('drawer shows a subtotal and checkout link', /Subtotal/.test(panel.textContent) && !!panel.querySelector('a[href$="/checkout"]'));
  panel.querySelector('[aria-label="Increase quantity"]').click();
  await until(() => w.Alpine.store('cart').count === 2, 8000);
  ok('increasing quantity updates the badge', w.Alpine.store('cart').count === 2, `count=${w.Alpine.store('cart').count}`);
  await until(() => /2/.test(panel.querySelector('output')?.textContent || ''), 8000);
  panel.querySelector('[aria-label^="Remove"]').click(); await until(() => /Your bag is empty/.test(panel.textContent), 8000);
  ok('removing the last item shows the empty state', /Your bag is empty/.test(panel.textContent) && w.Alpine.store('cart').count === 0, `count=${w.Alpine.store('cart').count} text=${panel.textContent.replace(/\s+/g, ' ').slice(0, 120)}`);
  ok('empty state offers a way forward', !!panel.querySelector('.empty a[href$="/shop"]'));
  key(w, 'Escape'); await sleep(500);

  /* ---------- confirm dialog ---------- */
  const form = d.createElement('form'); form.method = 'POST'; form.action = '/never'; d.body.appendChild(form);
  const evt = { preventDefault() { evt.prevented = true; }, target: form };
  w.Alpine.store('confirm').ask(evt, { title: 'Remove this address?', message: 'Gone for good.', label: 'Remove address' }); await sleep(500);
  const cd = d.querySelector('[aria-labelledby="confirm-title"]');
  ok('confirm is an alertdialog and blocks the original submit', cd.getAttribute('role') === 'alertdialog' && evt.prevented === true && visible(cd));
  ok('confirm shows the supplied text', /Remove this address\?/.test(cd.textContent) && /Remove address/.test(cd.textContent));
  ok('safe option is focused first', d.activeElement?.textContent.trim() === 'Keep it', d.activeElement?.textContent);
  key(w, 'Escape'); await sleep(400);
  ok('Escape cancels without submitting', w.Alpine.store('confirm').open === false && w.Alpine.store('confirm').form === null);

  /* ---------- mobile menu ---------- */
  f = await load('/', 390, 800); w = f.contentWindow; d = w.document;
  const burger = d.querySelector('button[aria-label="Open menu"]');
  burger.focus(); burger.click(); await sleep(900);
  const menu = d.querySelector('[aria-label="Menu"][role="dialog"]');
  const mpanel = menu.querySelector('[tabindex="-1"]');
  ok('mobile menu opens as a modal dialog', visible(menu) && menu.getAttribute('aria-modal') === 'true');
  ok('focus is inside the mobile menu', inside(mpanel, d.activeElement));
  ok('scroll locked while the menu is open', d.documentElement.classList.contains('scroll-locked'));
  key(w, 'Escape'); await until(() => !visible(menu), 2000);
  ok('Escape closes the mobile menu and returns focus to the button', !visible(menu) && d.activeElement === burger && !d.documentElement.classList.contains('scroll-locked'));

  /* ---------- form validation + loading state ---------- */
  f = await load('/register'); w = f.contentWindow; d = w.document;
  const email = d.getElementById('f-email');
  email.focus(); email.value = 'not-an-email'; email.dispatchEvent(new w.Event('input', { bubbles: true })); email.blur(); await sleep(150);
  const msg = d.getElementById('ve-f-email');
  ok('invalid email shows a plain-language message on blur', msg && /valid email address/i.test(msg.textContent), `msg=${msg?.textContent} hasFocus=${d.hasFocus()} form=${email.form?.outerHTML.slice(0, 80)}`);
  ok('field is marked invalid and linked to its message', email.getAttribute('aria-invalid') === 'true' && (email.getAttribute('aria-describedby') || '').includes('ve-f-email'));
  email.value = 'ok@example.com'; email.dispatchEvent(new w.Event('input', { bubbles: true })); await sleep(100);
  ok('message clears once the value is valid', !d.getElementById('ve-f-email') && !email.hasAttribute('aria-invalid'));
  const regForm = d.querySelector('form[action$="/register"]');
  const submit = regForm.querySelector('button:not([type="button"])');
  regForm.requestSubmit(submit); await sleep(150);
  ok('submitting an incomplete form focuses the first problem', d.activeElement && d.activeElement.id === 'f-name', d.activeElement?.id);
  ok('an invalid form does not show a loading spinner', !submit.classList.contains('is-loading') && !submit.disabled);

  f = await load('/login'); w = f.contentWindow; d = w.document;
  d.getElementById('f-email').value = 'nobody@example.com'; d.getElementById('f-password').value = 'wrong-password';
  const loginForm = d.querySelector('form[action$="/login"]'); const lb = loginForm.querySelector('button:not([type="button"])');
  loginForm.requestSubmit(lb); await sleep(40);
  ok('valid submit shows a spinner and blocks double clicks', lb.classList.contains('is-loading') && lb.disabled && lb.getAttribute('aria-busy') === 'true');
  const f2 = document.querySelector('iframe');
  await until(() => f2.contentDocument?.querySelector('[data-error-summary]'), 8000);      // wait for the POST + redirect
  const d2 = f2.contentDocument;
  await until(() => d2.activeElement && d2.activeElement.hasAttribute('data-error-summary'), 4000);
  ok('server error appears in a focused summary linking to the field', !!d2.querySelector('[data-error-summary][role="alert"] a[href="#f-email"]'), d2.querySelector('[data-error-summary]')?.textContent.replace(/\s+/g, ' ').slice(0, 80));
  ok('the summary receives focus', d2.activeElement && d2.activeElement.hasAttribute('data-error-summary'));
  ok('the spinner is gone after the page reloads', !d2.querySelector('.is-loading'));

  /* ---------- product gallery markup + empty states + skeleton ---------- */
  f = await load('/wishlist'); d = f.contentDocument;
  ok('wishlist uses the shared empty state', !!d.querySelector('.empty .empty__icon') && /Nothing saved yet/.test(d.body.textContent));
  const sk = d.createElement('span'); sk.className = 'skeleton skeleton--line'; d.body.appendChild(sk);
  const anim = f.contentWindow.getComputedStyle(sk).animationName;
  ok(reduced ? 'reduced motion: skeleton does not animate' : 'skeleton pulses (opacity only)', reduced ? (anim === 'none' || parseFloat(f.contentWindow.getComputedStyle(sk).animationDuration) < 0.01) : anim.includes('skeleton-pulse'), anim);
  const btn = d.querySelector('.btn');
  ok(reduced ? 'reduced motion: button transitions are instant' : 'buttons ease colour/transform', parseFloat(f.contentWindow.getComputedStyle(btn).transitionDuration) < (reduced ? 0.01 : 1), f.contentWindow.getComputedStyle(btn).transitionDuration);

  document.title = 'DONE ' + JSON.stringify(R);
})().catch((e) => { R.push(['FAIL', 'harness crashed', String(e && e.stack || e).slice(0, 300)]); document.title = 'DONE ' + JSON.stringify(R); });
</script>
